syntax = "proto3";

package user.v1;

import "chat/v1/chat.proto";
import "common/v1/common.proto";
import "resource/v1/resource.proto";

// Service for managing users.
service UserService {
  // Checks if a user exists by ID.
  rpc UserExists(UserExistsRequest) returns (UserExistsResponse);

  // Authenticates a user.
  rpc AuthUser(AuthUserRequest) returns (AuthUserResponse);

  // Verifies an email.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);

  // Creates a new user.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Deletes a user by ID.
  //
  // Requires Authentication: Only the user itself can delete his own account.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // Updates a user.
  //
  // Requires Authentication: Only the user itself can update his own account.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // Gets a user by ID.
  //
  // Requires Authentication: All authenticated users can get a user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // Searches for users by query.
  //
  // Requires Authentication: All authenticated users can search for users.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Blocks a user.
  //
  // Requires Authentication: Only the user itself can block or unblock.
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);

  // Check if a user is blocked.
  //
  // Requires Authentication: Only authenticated users can do this.
  rpc IsBlocked(IsBlockedRequest) returns (IsBlockedResponse);
}

// Request message for checking if a user exists.
message UserExistsRequest {
  // User ID of the user.
  string user_id = 1;
}

// Response message for checking if a user exists.
message UserExistsResponse {
  // Error, if user does not exist or any other error.
  optional common.v1.Error error = 1;
}

// Request message for authenticating a user.
message AuthUserRequest {
  // User ID of the user.
  string user_id = 1;
  // Password of the user.
  string password = 2;
}

// Response message for authenticating a user.
message AuthUserResponse {
  // Authentication token.
  string token = 1;
  // The user.
  User user = 2;
  // Error, if any.
  optional common.v1.Error error = 3;
}

// Request message for verifying an email.
message VerifyEmailRequest {
  // The E-Mail to verify
  string email = 1;
}

// Response message for verifying an email.
message VerifyEmailResponse {
  // Error, if any.
  optional common.v1.Error error = 1;
}

// Request message for creating a user.
message CreateUserRequest {
  // Unique user identifier.
  string user_id = 1;
  // Username of the user.
  string username = 2;
  // Email of the user.
  string email = 3;
  // Password of the user.
  string password = 4;
  // E-Mail verification token.
  string verification_token = 5;
}

// Response message for creating a user.
message CreateUserResponse {
  // Error, if any.
  optional common.v1.Error error = 1;
}

// Request message for deleting a user.
message DeleteUserRequest {
  // Password of the user.
  string password = 1;
}

// Response message for deleting a user.
message DeleteUserResponse {
  // Error, if any.
  optional common.v1.Error error = 1;
}

// Request message for updating a user.
message UpdateUserRequest {
  // Username of the user.
  optional string username = 2;
  // Email of the user.
  optional string email = 3;
  // Password of the user.
  optional string password = 4;
}

// Response message for updating a user.
message UpdateUserResponse {
  // Error, if any.
  optional common.v1.Error error = 1;
}

// Request message for getting a user.
message GetUserRequest {
  // ID of the user to get.
  string user_id = 1;
}

// Response message for getting a user.
message GetUserResponse {
  // One of the following results.
  oneof result {
    // User profile.
    UserProfile user = 1;
    // Error, if any.
    common.v1.Error error = 2;
  }
}

// Request message for searching users.
message SearchUsersRequest {
  // Query string to search for.
  string query = 1;
}

// Response message for searching users.
message SearchUsersResponse {
  // List of users matching the query.
  repeated UserProfile users = 1;
  // Error, if any.
  optional common.v1.Error error = 2;
}

// Request message for blocking a user.
message BlockUserRequest {
  // ID of the user to block.
  string user_id = 1;
  // Whether to block or unblock the user.
  bool block = 2;
}

// Response message for blocking a user.
message BlockUserResponse {
  // Error, if any.
  optional common.v1.Error error = 1;
}

// Request for checking the blocking status of a user.
message IsBlockedRequest {
  // ID of the user to check.
  string user_id = 1;
}

// Response for checking the blocking status of a user.
message IsBlockedResponse {
  oneof result {
    // If the user is blocked.
    bool blocked = 1;
    // Error, if any.
    common.v1.Error error = 2;
  }
}

// An application user.
//
// When used in an RPC response, the password **must** be empty.
message User {
  // Unique user identifier.
  string user_id = 1;
  // Username of the user.
  string username = 2;
  // Email of the user.
  string email = 3;
  // Password of the user.
  //
  // When used in an RPC response, the password **must** be empty.
  string password = 4;
  // Role of the user.
  UserRole role = 5;
  // Timestamp when the user was created.
  common.v1.Timestamp created_at = 6;
  // Icon/Avatar of the user.
  resource.v1.ResourceId icon = 7;
  // Notifications of the user.
  repeated Notification notifications = 8;
  // Channels the User is in
  repeated chat.v1.Channel channels = 9;
}

// User profile.
//
// A safe representation of a user without sensitive information.
message UserProfile {
  // Unique user identifier.
  string user_id = 1;
  // Username of the user.
  string username = 2;
  // Role of the user.
  UserRole role = 3;
  // Timestamp when the user was created.
  common.v1.Timestamp created_at = 4;
  // Icon/Avatar of the user.
  resource.v1.ResourceId icon = 5;
}

// Role of the user.
enum UserRole {
  // Default value is a normal user.
  USER_ROLE_USER_UNSPECIFIED = 0;
  // A moderator user.
  USER_ROLE_MODERATOR = 1;
  // An administrator user.
  USER_ROLE_ADMIN = 2;
}

// A user notification.
message Notification {
  // ID of the notification.
  string notification_id = 1;
  // Timestamp of the notification.
  common.v1.Timestamp timestamp = 2;
  // The type of the notification.
  oneof notification {
    // The user got invited to a user chat.
    InviteNotification invite = 3;
    // The user received a message.
    MessageNotification message = 4;
  }
}

// A chat notification.
message InviteNotification {
  // ID of the chat channel.
  string channel_id = 1;
  // ID of the user who invited the user.
  string invited_by = 2;
}

// A chat message notification.
message MessageNotification {
  // ID of the chat channel.
  string channel_id = 1;
  // ID of the user who sent the message.
  string sender_id = 2;
  // The message.
  chat.v1.Message message = 3;
}
