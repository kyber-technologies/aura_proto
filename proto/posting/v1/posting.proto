syntax = "proto3";

package posting.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";
import "resource/v1/resource.proto";

// Service for managing resources.
service PostingService {
  // Request for getting the user feed.
  rpc Feed(FeedRequest) returns (FeedResponse);

  // Publish a new post.
  //
  // Requires Authentication: Only authenticated users can publish posts.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Unpublish (delete) a post.
  //
  // Requires Authentication: Only authorized users can delete posts.
  rpc Unpublish(UnpublishRequest) returns (UnpublishResponse);

  // Get multiple posts.
  //
  // Requires Authentication: Only authenticated users can get posts.
  rpc Get(GetRequest) returns (GetResponse);

  // Get posts of a user.
  //
  // Requires Authentication: Only authenticated users can get posts.
  rpc GetOf(GetOfRequest) returns (GetOfResponse);

  // Search posts.
  //
  // Requires Authentication: Only authenticated users can search posts.
  rpc Search(SearchRequest) returns (SearchResponse);

  // React to a post.
  //
  // Requires Authentication: Only authenticated users can react to posts.
  rpc React(ReactRequest) returns (ReactResponse);
}

// Request for getting the user feed.
message FeedRequest {
  // The maximum number of recommendations to return.
  uint32 limit = 1;
  // The index of the page to return.
  uint32 index = 2;
}

// Response for getting the user feed.
message FeedResponse {
  // The returned post IDs.
  repeated string post_ids = 1;
  // The error, if any.
  optional common.v1.Error error = 2;
}

// Request for publishing a new post.
message PublishRequest {
  // The post content.
  resource.v1.Content content = 1;
  // The optional parent post ID.
  //
  // If set, this post is a comment under the specified post.
  optional string parent = 2;
}

// Response for publishing a new post.
message PublishResponse {
  // The result of the operation.
  oneof result {
    // The published post.
    Post post = 1;
    // The error, if any.
    common.v1.Error error = 2;
  }
}

// Request for unpublishing a post.
message UnpublishRequest {
  // The post ID to delete.
  string post_id = 1;
}

// Response for unpublishing a post.
message UnpublishResponse {
  // The error, if any.
  optional common.v1.Error error = 1;
}

// Request for getting posts.
message GetRequest {
  // The post IDs to get.
  repeated string post_id = 1;
}

// Response for getting posts.
message GetResponse {
  // The requested posts.
  repeated Post posts = 1;
  // The error, if any.
  common.v1.Error error = 2;
}

// Request for getting posts of a user.
message GetOfRequest {
  // The user ID of the author.
  string author_id = 1;
  // The maximum number of posts to return.
  uint32 limit = 2;
  // The timestamp to start from.
  google.protobuf.Timestamp start_at = 3;
}

// Response for getting posts of a user.
message GetOfResponse {
  // The posts of the user.
  repeated Post posts = 1;
  // The error, if any.
  optional common.v1.Error error = 2;
}

// Request for searching posts.
message SearchRequest {
  // The search query.
  string query = 1;
  // The maximum number of posts to return.
  uint32 limit = 2;
  // The timestamp to start from.
  google.protobuf.Timestamp start_at = 3;
}

// Response for searching posts.
message SearchResponse {
  // The search results.
  repeated Post posts = 1;
  // The error, if any.
  optional common.v1.Error error = 2;
}

// Request for reacting to a post.
message ReactRequest {
  // The ID of the post.
  string post_id = 1;
  // The reaction.
  PostReaction reaction = 2;
}

// Response for reacting to a post.
message ReactResponse {
  // The error, if any.
  optional common.v1.Error error = 1;
}

message Post {
  // A unique post ID.
  string post_id = 1;
  // The user ID of the post author.
  string author_id = 2;
  // The post content.
  resource.v1.Content content = 3;
  // The last time the post changed.
  google.protobuf.Timestamp timestamp = 4;
  // The optional parent post ID.
  //
  // If set, this post is a comment under the specified post.
  optional string parent = 5;
  // The reactions of all users to this post.
  //
  // Every string corresponds to a `PostReaction`.
  map<string, uint32> reactions = 6;
  // The reaction of the current user to this post.
  PostReaction reaction = 7;
}

// A reaction to a post from a user.
enum PostReaction {
  // No reaction.
  POST_REACTION_UNSPECIFIED = 0;
  // A like reaction.
  POST_REACTION_LIKE = 1;
  // A dislike reaction.
  POST_REACTION_DISLIKE = 2;
}
